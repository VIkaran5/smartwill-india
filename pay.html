<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartWill India - Secure Payment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
      color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 360px; width: 100%; }
    .logo { font-size: 2rem; margin-bottom: 12px; }
    .loader {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,183,0,0.25);
      border-top-color: #ffb700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.3rem; margin-bottom: 8px; font-weight: 600; }
    p { opacity: 0.65; font-size: 0.9rem; line-height: 1.5; }
    .secured { margin-top: 32px; opacity: 0.4; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔐</div>
    <div class="loader" id="loader"></div>
    <h2 id="title">Secure Payment</h2>
    <p id="msg">Initializing Cashfree checkout...</p>
    <p class="secured">🔒 256-bit SSL · PCI DSS Certified</p>
  </div>

  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <script>
  (function () {
    var params    = new URLSearchParams(window.location.search);
    var sessionId = params.get('session_id');
    var orderId   = params.get('order_id');

    // ── Return path: Cashfree redirected back after payment ──────────────────
    // URL: /pay.html?order_id=SW_xxx  (no session_id)
    if (orderId && !sessionId) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('title').textContent = 'Payment Complete';
      document.getElementById('msg').textContent = 'Returning to SmartWill India...';
      // Redirect to custom scheme — Android intercepts, closes Chrome Custom Tab,
      // brings SmartWill back to foreground and fires App.appUrlOpen event.
      setTimeout(function () {
        window.location.href = 'com.smartwillindia.app://payment?order_id=' + encodeURIComponent(orderId);
      }, 400);
      return; // IIFE return — valid here
    }

    // ── Error path: neither param present ────────────────────────────────────
    if (!sessionId) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('title').textContent = 'Invalid Link';
      document.getElementById('msg').textContent = 'This payment link is invalid. Please close and tap Pay again.';
      return; // IIFE return — valid here
    }

    // ── Checkout path: call Cashfree SDK immediately ──────────────────────────
    // The Cashfree SDK script above is synchronous (no async/defer), so by the
    // time this IIFE runs, window.Cashfree IS defined. No need to wait for
    // DOMContentLoaded — we can call checkout() directly.
    document.getElementById('msg').textContent = 'Loading secure checkout...';

    // Safety timeout: if the page hasn't navigated away in 12s, show error.
    var timer = setTimeout(function () {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('title').textContent = 'Taking too long';
      document.getElementById('msg').textContent = 'Could not load Cashfree checkout. Please close and tap Pay again.';
    }, 12000);

    try {
      if (typeof Cashfree === 'undefined') {
        throw new Error('Cashfree SDK not loaded');
      }
      var cashfree = Cashfree({ mode: 'production' });
      cashfree.checkout({
        paymentSessionId: sessionId,
        redirectTarget: '_self'
      });
      // checkout() triggers a page navigation (redirectTarget:'_self'), so this
      // page will unload. Clear the timeout just in case it doesn't navigate.
      clearTimeout(timer);
    } catch (err) {
      clearTimeout(timer);
      document.getElementById('loader').style.display = 'none';
      document.getElementById('title').textContent = 'Error';
      document.getElementById('msg').textContent = 'Could not start payment: ' + err.message + '. Please close and tap Pay again.';
    }
  })();
  </script>

</body>
</html>
